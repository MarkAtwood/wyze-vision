services:
  wyze-snapshot:
    build: .
    image: wyze-snapshot:local
    container_name: wyze-snapshot
    # HA runs network_mode: host; go2rtc's :1984 API is reached on loopback and
    # KVS WebRTC needs unrestricted UDP for the TURN relay, so use host net too.
    network_mode: host
    # Mount HA's config dir (sibling ./config of the HA compose). We READ the
    # Wyze tokens from /config/.storage/core.config_entries and WRITE JPEGs to
    # /config/wyze_snapshots/.
    volumes:
      - ../config:/config
      # Front-porch person archive (Hassio-5sa): the proxmox ZFS share
      # tank/shared, NFS-mounted on this host at /mnt/tank-shared. Person events
      # on the porch cam copy the current still into <key>/ subdirs here. The
      # NFS mount must be UP before this container starts, else docker would
      # auto-create an empty LOCAL /mnt/tank-shared/wyze and writes would miss
      # the ZFS; fstab _netdev handles that on boot.
      - /mnt/tank-shared/wyze:/archive
    environment:
      - REFRESH_SECONDS=600
      - OUT_DIR=/config/wyze_snapshots
      - CONFIG_ENTRIES=/config/.storage/core.config_entries
      # Optional Wyze cloud conn-state bridge (Hassio-708). Publishes retained
      # wyze/<mac>/status to the dokr broker for the device-inventory sidecar.
      # Host/user are non-secret; MQTT_PASS comes from the gitignored .env. With
      # no .env the password is empty and the publisher disables itself, so this
      # sidecar stays secretless by default.
      - MQTT_HOST=10.69.44.52
      - MQTT_PORT=1883
      - MQTT_USER=wyzesnap
      - MQTT_PASS=${MQTT_PASS:-}
      # Optional event-driven fast path (Hassio-i0w): on a wyze_camera_event,
      # grab a fresh still for that one camera immediately instead of waiting for
      # the next periodic cycle. HA_URL is non-secret; HA_TOKEN (an HA LLAT named
      # 'wyze-snapshot') comes from the gitignored .env. With no .env the token is
      # empty and the listener disables itself, so this sidecar stays secretless.
      - HA_URL=ws://127.0.0.1:8123/api/websocket
      - HA_TOKEN=${HA_TOKEN:-}
      - EVENT_MIN_INTERVAL=15
      # Event-still archive (Hassio-5sa / -bp8 / -ud0). Reuses the HA_TOKEN
      # listener above. Active only when the sentinel ARCHIVE_MARKER file exists
      # inside /archive (created once on the ZFS: `touch
      # /mnt/tank/shared/wyze/.archive_root`); if the NFS mount is down docker
      # auto-creates an empty LOCAL /archive without the marker and the archive
      # disables, so stills never land on local disk. ARCHIVE_RULES is JSON
      # {stream_key: [label, ...]} (labels: person/pet/vehicle/package, or "any"
      # for every event) -- edit here to add/change archived cams or event types,
      # no code change. Per-cam subdirs are auto-created on first write.
      - ARCHIVE_DIR=/archive
      - ARCHIVE_MARKER=.archive_root
      - 'ARCHIVE_RULES={"front_door": ["person"]}'
      - ARCHIVE_RETENTION_DAYS=100
    restart: unless-stopped
