# Cameras dashboard: Wyze still tiles -> tap for live WebRTC.
#
# Wired into the sidebar via `lovelace: dashboards:` in configuration.yaml.
# Deployed to /config/dashboards/cameras.yaml on the hassio VM.
#
# Each picture-glance card renders the still snapshot (camera_image =
# camera.wyze_<key>_snapshot, a local_file camera fed by the wyze-snapshot
# sidecar -- zero streaming, just a file re-read) while `entity` points at the
# live WebRTC camera (camera.<key>) so a tap opens the live stream more-info.
#
# NOTE: picture-glance (NOT picture-entity) is required. picture-entity treats
# `entity` as the image source when it is a camera and IGNORES camera_image; the
# live ha-wyzeapi cams return HTTP 500 on /api/camera_proxy (WebRTC-only, no
# still JPEG), blanking every tile. picture-glance feeds camera_image straight
# to the image renderer, so the reliable still always shows. `entities: []` is
# required by the picture-glance schema (empty list is valid).
#
# LAYOUT: a default (masonry) view with each picture-glance as a TOP-LEVEL card.
# In masonry every card occupies one ~500px column and the cards auto-tile 3-4
# across the full screen width, so each camera renders large and responsively.
# Do NOT wrap these in a `type: grid` card: in masonry a single grid card is
# confined to ONE ~500px column, so a `columns: 3` grid squeezes each tile down
# to ~150px (the tiny-tile bug, Hassio-0gk). Online cams lead; offline cams
# (dark "offline since" placeholder from the sidecar) follow.
title: Cameras
views:
  - title: Wyze
    path: wyze
    icon: mdi:cctv
    cards:
      # --- Online ---
      - type: picture-glance
        title: Front Door
        entity: camera.front_door
        camera_image: camera.wyze_front_door_snapshot
        entities: []
