# Cameras dashboard: Wyze event log + still tiles -> tap a tile for live WebRTC.
#
# Wired into the sidebar via `lovelace: dashboards:` in configuration.yaml.
# Deployed to /config/dashboards/cameras.yaml on the HA host.
#
# LAYOUT: a PANEL view (`panel: true`) whose single root card is a vertical-stack
# of three full-width bands:
#   1. Event log + Vision -- a horizontal-stack: sensor.wyze_event_log rolling
#      history (markdown) on the LEFT, latest per-cam Gemini scene read
#      (sensor.wyze_*_vision, markdown; auto-lists every vision sensor, newest
#      first) on the RIGHT.
#   2. Live cameras      -- the cams that were online (grid, 3 per row).
#   3. Offline cameras   -- the cams that were offline (grid, 3 per row); dark
#      "offline since" placeholder rendered by the wyze-vision sidecar.
#
# WHY panel + vertical-stack + grid (the third attempt):
#   * masonry top-level cards tile full-width and LARGE, but masonry has no hard
#     row-break, so it cannot form clean horizontal bands.
#   * `type: sections` CAN group into labeled bands, but each section is hard-
#     capped at ~500px wide (even with max_columns:1), so the camera grid inside
#     it shrinks to tiny tiles (verified: "way too small").
#   * a PANEL view renders its single root card EDGE-TO-EDGE with no ~500px cap,
#     so a `grid` card placed inside fills the FULL dashboard width and tiles its
#     cameras large -- while the vertical-stack stacks the three bands. The tiny-
#     tile bug only happens when a grid is trapped inside one ~500px masonry
#     column; here the grid owns the full width.
#   NOTE: panel mode shows only the FIRST card of the view, so EVERYTHING must
#   live under the single root vertical-stack.
#
# CARD TYPE: picture-glance (NOT picture-entity). picture-entity treats `entity`
# as the image source when it is a camera and IGNORES camera_image; the live
# ha-wyzeapi cams return HTTP 500 on /api/camera_proxy (WebRTC-only, no still
# JPEG), blanking every tile. picture-glance feeds camera_image (the reliable
# local_file still from the wyze-vision sidecar) straight to the image
# renderer, while `entity` (the live WebRTC cam) is the tap -> more-info target.
# `entities: []` is required by the picture-glance schema (empty list is valid).
# grid `square: false` keeps the camera image aspect ratio (no square crop).
#
# NOTE: the Live/Offline split is STATIC (membership = last-known state when this
# file was written). A live split would need a custom auto-entities card, which
# is not installed. The camera keys below are EXAMPLES -- replace them with yours.
title: Cameras
views:
  - title: Wyze
    path: wyze
    icon: mdi:cctv
    panel: true
    cards:
      - type: vertical-stack
        cards:
          # --- Band 1: Event log (left) + Vision (right), side by side ---
          # A horizontal-stack splits the band 50/50: the rolling event log on the
          # left, the latest per-cam Gemini vision read on the right. Each side is
          # its own heading+content vertical-stack.
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: markdown
                    content: "## Wyze Event Log"
                  - type: markdown
                    title: Wyze Event Log
                    content: >
                      {% set rows = state_attr('sensor.wyze_event_log', 'entries') or [] %}
                      {% set ns = namespace(lines=[]) %}
                      {% for e in rows %}
                      {% set ns.lines = ns.lines + ['**' ~ e.cam ~ '** &middot; ' ~ e.label ~ ' &middot; ' ~ relative_time(as_datetime(e.ts)) ~ ' ago'] %}
                      {% endfor %}
                      {{ ns.lines | join('\n\n') if ns.lines else '_No Wyze events recorded yet._' }}
              # Latest per-cam Gemini read (sensor.wyze_<key>_vision; state = event
              # time, description in attributes). Cams with a real change vs their
              # cached baseline are bold; "no change" reads are muted. Auto-lists
              # every vision sensor, newest first -- no per-cam edits needed.
              - type: vertical-stack
                cards:
                  - type: markdown
                    content: "## Wyze Vision"
                  - type: markdown
                    title: Wyze Vision
                    content: >
                      {% set ns = namespace(items=[]) %}
                      {% for s in states.sensor %}
                      {% if s.entity_id.startswith('sensor.wyze_') and s.entity_id.endswith('_vision') and s.state not in ['unknown', 'unavailable'] %}
                      {% set ns.items = ns.items + [s] %}
                      {% endif %}
                      {% endfor %}
                      {% set rows = ns.items | sort(attribute='state', reverse=true) %}
                      {% set out = namespace(lines=[]) %}
                      {% for s in rows %}
                      {% set cam = state_attr(s.entity_id, 'camera') or s.entity_id %}
                      {% set summary = state_attr(s.entity_id, 'summary') or state_attr(s.entity_id, 'description') or '(no description)' %}
                      {% set changed = state_attr(s.entity_id, 'change_detected') %}
                      {% set ago = relative_time(as_datetime(s.state)) ~ ' ago' %}
                      {% if changed %}
                      {% set out.lines = out.lines + ['**' ~ cam ~ '** &middot; ' ~ summary ~ ' &middot; ' ~ ago] %}
                      {% else %}
                      {% set out.lines = out.lines + [cam ~ ' &middot; _no change_ &middot; ' ~ ago] %}
                      {% endif %}
                      {% endfor %}
                      {{ out.lines | join('\n\n') if out.lines else '_No vision reads yet._' }}
          # --- Band 2: Live cameras ---
          - type: markdown
            content: "## Live cameras"
          - type: grid
            columns: 3
            square: false
            cards:
              - type: picture-glance
                title: Front Door
                entity: camera.front_door
                camera_image: camera.wyze_front_door_snapshot
                entities: []
              - type: picture-glance
                title: Driveway
                entity: camera.driveway
                camera_image: camera.wyze_driveway_snapshot
                entities: []
              - type: picture-glance
                title: Backyard
                entity: camera.backyard
                camera_image: camera.wyze_backyard_snapshot
                entities: []
              - type: picture-glance
                title: Garage
                entity: camera.garage
                camera_image: camera.wyze_garage_snapshot
                entities: []
              - type: picture-glance
                title: Garden
                entity: camera.garden
                camera_image: camera.wyze_garden_snapshot
                entities: []
              - type: picture-glance
                title: Porch
                entity: camera.porch
                camera_image: camera.wyze_porch_snapshot
                entities: []
              - type: picture-glance
                title: Side Gate
                entity: camera.side_gate
                camera_image: camera.wyze_side_gate_snapshot
                entities: []
              - type: picture-glance
                title: Patio
                entity: camera.patio
                camera_image: camera.wyze_patio_snapshot
                entities: []
              - type: picture-glance
                title: Shed
                entity: camera.shed
                camera_image: camera.wyze_shed_snapshot
                entities: []
              - type: picture-glance
                title: Greenhouse
                entity: camera.greenhouse
                camera_image: camera.wyze_greenhouse_snapshot
                entities: []
              - type: picture-glance
                title: Front Walk
                entity: camera.front_walk
                camera_image: camera.wyze_front_walk_snapshot
                entities: []
              - type: picture-glance
                title: Carport
                entity: camera.carport
                camera_image: camera.wyze_carport_snapshot
                entities: []
          # --- Band 3: Offline cameras ---
          - type: markdown
            content: "## Offline cameras"
          - type: grid
            columns: 3
            square: false
            cards:
              - type: picture-glance
                title: Basement
                entity: camera.basement
                camera_image: camera.wyze_basement_snapshot
                entities: []
              - type: picture-glance
                title: Workshop
                entity: camera.workshop
                camera_image: camera.wyze_workshop_snapshot
                entities: []
              - type: picture-glance
                title: Pool
                entity: camera.pool
                camera_image: camera.wyze_pool_snapshot
                entities: []
              - type: picture-glance
                title: Mailbox
                entity: camera.mailbox
                camera_image: camera.wyze_mailbox_snapshot
                entities: []
              - type: picture-glance
                title: Side Yard
                entity: camera.side_yard
                camera_image: camera.wyze_side_yard_snapshot
                entities: []
              - type: picture-glance
                title: Balcony
                entity: camera.balcony
                camera_image: camera.wyze_balcony_snapshot
                entities: []
              - type: picture-glance
                title: Deck
                entity: camera.deck
                camera_image: camera.wyze_deck_snapshot
                entities: []
              - type: picture-glance
                title: Courtyard
                entity: camera.courtyard
                camera_image: camera.wyze_courtyard_snapshot
                entities: []
